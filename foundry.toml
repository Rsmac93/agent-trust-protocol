[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fuzz = { runs = 1024 }

[fmt]
line_length = 100

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
# Etherscan V2 unified API (single key works across all supported chains,
# routed by chainid). chainid 84532 = Base Sepolia. The old per-chain
# Basescan V1 endpoint (api-sepolia.basescan.org) is deprecated.
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
